{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tamhub-api.fullname" . }}-ingress
  labels:
    {{- include "tamhub-api.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls: 
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ required "ingress.tls.secretName  must be defined" .Values.ingress.tls.secretName }}  
  {{- end }}
  rules:
  - host: {{ required "ingress.host is required" .Values.ingress.host }}
    http:
      paths:
      - backend:
          service:
            name: {{ include "tamhub-api.fullname" . }}-svc
            port:
              number: {{ .Values.service.port }}
        path: {{ .Values.ingress.path }}
        pathType: Prefix
{{- end }}
