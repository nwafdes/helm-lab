{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tamhub-api.fullname" . }}-ingress
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls: 
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ required "secretName must be defined" .Values.ingress.tls.secretName }}  
  {{- end }}
  rules:
  - host: {{ required "ingress.host is required" .Values.ingress.host }}
      http:
        paths:
        - backend:
            service:
              name: {{ include "tamhub-api.fullname" . }}-svc
              port:
                number: {{ .Values.service.port }}
          path: {{ .Values.ingress.path }}
          pathType: Prefix
{{- end }}
