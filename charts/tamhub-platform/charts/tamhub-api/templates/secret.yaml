{{- if not .Values.secret.existingSecret }}
apiVersion: v1
data: 
  api-key: {{ required "secret.existingSecret or secret.apiKey must be set" .Values.secret.apiKey | b64enc }}
kind: Secret
metadata:
  name: {{ include "tamhub-api.fullname" . }}-secret
  labels:
    {{- include "tamhub-api.labels" . | nindent 4 }}
{{- end }}
